<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOM Studio | Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app profile-app">
      <header class="hero">
        <span class="pill">DOM STUDIO · MEMBER PROFILE</span>
        <h1>Your <span>profile.</span></h1>
        <p>Your registration details and profile QR code.</p>
      </header>

      <section class="panel profile-panel" aria-labelledby="profileName">
        <article id="profile">
          <div class="avatar" id="avatar">U</div>
          <h2 id="profileName" class="profile-name"></h2>
          <p id="profileEmail" class="muted"></p>
          <div class="detail">
            <b>Account ID</b><span id="profileId"></span>
          </div>
          <div class="detail">
            <b>Contact</b><span id="profilePhone"></span>
          </div>
          <div class="detail">
            <b>Message</b><span id="profileMessage"></span>
          </div>
          <div class="detail">
            <b>Registered</b><span id="profileCreatedAt"></span>
          </div>
          <div class="qr-area">
            <h2>Profile QR code</h2>
            <div id="qrcode" aria-label="Profile QR code"></div>
            <p class="hint">
              Scan to read your non-sensitive registration details.
            </p>
            <button id="downloadQR" class="secondary" type="button">
              Download QR code
            </button>
            <p id="qrStatus" class="status" role="status" aria-live="polite"></p>
          </div>
          <button
            id="logoutButton"
            class="secondary logout-button"
            type="button"
          >
            Log out
          </button>
        </article>
      </section>

      <footer>HTML · CSS · JavaScript · Express · MongoDB</footer>
    </main>

    <script src="vendor/qrcodejs/qrcode.min.js" defer></script>
    <script src="profile.js" defer></script>
  </body>
</html>
